# inet-corp-site.yaml

zabbix_export:
  version: '8.0'

  host_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Applications

  hosts:
    - host: Corporate site
      name: Corporate site
      tags:
        - tag: criticality
          value: low

      groups:
        - name: Applications

      templates:
        - name: Custom HTTP Check
        - name: Custom Ping Check

      macros:
        - macro: '{$HTTP.TARGET}'
          value: www.egov.kz

        - macro: '{$PING.TARGET}'
          value: egov.kz

        - macro: '{$HTTP.INTERVAL}'
          value: 3m
        - macro: '{$PING.INTERVAL}'
          value: 1m
        - macro: '{$PING.LATENCY.IDEAL}'
          value: '30'
        - macro: '{$PING.LATENCY.MAX}'
          value: '100'
