# ============================================================================
# Custom UserParameters for Zabbix Agent 2
# ============================================================================

# --- SCREEN LOCK & IDLE TIMEOUT AUDITING ---

# Machine inactivity lock timeout in seconds enforced by GPO (returns seconds, e.g., 900 = 15 mins; 0 if not set)
UserParameter=win.sec.lock.inactivity.timeout,for /f "tokens=3" %a in ('reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v InactivityTimeoutSecs 2^>nul ^| find "InactivityTimeoutSecs"') do @set /a "val=%a" & cmd /v:on /c "echo !val!" || echo 0

# Screen Saver is enforced via machine/user policy (1 = enabled, 0 = disabled)
UserParameter=win.sec.lock.screensaver.enabled,reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop" /v ScreenSaveActive 2>nul | find /c "1"

# Password is required on wake from sleep (AC/Plugged in) via Power Policy (1 = required/safe, 0 = not required)
UserParameter=win.sec.lock.wake.password.ac,powercfg /q SCHEME_CURRENT SUB_NONE CONSOLELOCK 2>nul | find "Current AC Power Setting Index:" | find /c "0x00000001"

# Password is required on wake from sleep (DC/Battery) via Power Policy (1 = required/safe, 0 = not required)
UserParameter=win.sec.lock.wake.password.dc,powercfg /q SCHEME_CURRENT SUB_NONE CONSOLELOCK 2>nul | find "Current DC Power Setting Index:" | find /c "0x00000001"

# Password is required upon Screen Saver resume via policy (1 = required/safe, 0 = not required)
UserParameter=win.sec.lock.screensaver.password,reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop" /v ScreenSaverIsSecure 2>nul | find /c "1"
