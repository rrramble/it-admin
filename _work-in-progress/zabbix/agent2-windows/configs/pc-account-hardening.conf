# ============================================================================
# Custom UserParameters for Zabbix Agent 2
# ============================================================================

# --- ACCOUNT, PASSWORD & PRIVILEGE AUDITING ---

# Built-in Guest account is active (0 = disabled/safe, 1 = enabled/risk)
UserParameter=win.sec.acc.guest.active,net user Guest 2>nul | findstr /B /C:"Account active" | find /c "Yes"

# Built-in Administrator account is active (0 = disabled/safe, 1 = enabled)
UserParameter=win.sec.acc.admin.active,net user Administrator 2>nul | findstr /B /C:"Account active" | find /c "Yes"

# WDigest cleartext password caching in memory is disabled (0 = safe/disabled, 1 = vulnerable)
UserParameter=win.sec.wdigest.enabled,reg query "HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest" /v UseLogonCredential 2>nul | find /c "0x1"

# Count total local user accounts on the machine (detects rogue local accounts)
#UserParameter=win.sec.acc.local.count,wmic useraccount where "LocalAccount='True'" get name 2>nul | find /v "Name" | find /c /v ""

# RDP Network Level Authentication (NLA) is enforced (1 = enforced/safe, 0 = weak)
#UserParameter=win.sec.rdp.nla,reg query "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication 2>nul | find /c "0x1"

