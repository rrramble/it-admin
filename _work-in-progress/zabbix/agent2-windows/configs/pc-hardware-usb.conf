# ============================================================================
# Custom UserParameters for Zabbix Agent 2
# ============================================================================

# --- HARDWARE, USB & SYSTEM INTEGRITY ---

# AutoRun / AutoPlay is disabled for all drives (1 = disabled/safe, 0 = enabled)
UserParameter=win.sec.autorun.disabled,reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer" /v NoDriveTypeAutoRun 2>nul | find /c "0xff"

# Windows Event Log service is running (1 = running, 0 = stopped/tampered)
UserParameter=win.sec.audit.eventlog,sc query EventLog 2>nul | find /c "RUNNING"

# Windows Service installations (Event ID 7045) in System log over last 24 hours (detects persistence)
UserParameter=win.sec.audit.new.services,wevtutil qe System /q:"*[System[(EventID=7045) and TimeCreated[timediff(@SystemTime) <= 86400000]]]" /f:text 2>nul | find /c "Event["

# Scheduled Tasks created (Event ID 4698) in Security log over last 24 hours (detects persistence)
UserParameter=win.sec.audit.new.tasks,wevtutil qe Security /q:"*[System[(EventID=4698) and TimeCreated[timediff(@SystemTime) <= 86400000]]]" /f:text 2>nul | find /c "Event["

# Count Security Audit Log cleared events (Event ID 1102) in last 7 days (detects attacker covering tracks)
UserParameter=win.sec.audit.log.cleared,wevtutil qe Security /q:"*[System[(EventID=1102) and TimeCreated[timediff(@SystemTime) <= 604800000]]]" /f:text 2>nul | find /c "Event["

# Non-comment lines count in Windows hosts file (detects DNS hijacking/malware redirects)
#UserParameter=win.sec.hosts.entries,findstr /v /b /c:"#" /c:" " /c:"	" "%SystemRoot%\System32\drivers\etc\hosts" 2>nul | find /c /v ""

