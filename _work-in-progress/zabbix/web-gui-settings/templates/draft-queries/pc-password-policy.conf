# ============================================================================
# Custom UserParameters for Zabbix Agent 2
# ============================================================================

# --- PASSWORD POLICY AUDITING ---

# Get the enforced Minimum Password Length policy (returns integer, e.g., 8 or 12; 0 means no minimum)
UserParameter=win.sec.pass.min.length,for /f "tokens=4" %a in ('net accounts ^| findstr /C:"Minimum password length"') do @echo %a

# Get Account Lockout Threshold (returns number of failed attempts before lock; "Never" if disabled)
UserParameter=win.sec.pass.lockout.threshold,for /f "tokens=3" %a in ('net accounts ^| findstr /C:"Lockout threshold"') do @echo %a

# Get Maximum Password Age in days (returns integer, e.g., 90; "Unlimited" if never expires)
#UserParameter=win.sec.pass.max.age,for /f "tokens=4" %a in ('net accounts ^| findstr /C:"Maximum password age"') do @echo %a

# Check if Complexity Requirements (uppercase, lowercase, digits, symbols) are enabled (1 = enabled, 0 = disabled)
#UserParameter=win.sec.pass.complexity,secedit /export /cfg "%TEMP%\secpol.cfg" >nul 2>&1 && findstr /C:"PasswordComplexity = 1" "%TEMP%\secpol.cfg" >nul && (del /f /q "%TEMP%\secpol.cfg" & echo 1) || (del /f /q "%TEMP%\secpol.cfg" 2>nul & echo 0)
