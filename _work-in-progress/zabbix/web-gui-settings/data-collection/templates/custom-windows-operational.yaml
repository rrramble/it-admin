            label: 'Filter for filesystems by name (exclude)'
            description: 'Regex string to exclude discovered filesystems by name.'
        - macro: '{$VFS.FS.FSTYPE.MATCHES}'
          value: '.*'
          description: 'Used in filesystem discovery. Can be overridden on the host or linked template level.'
          config:
            type: TEXT
            priority: '16'
            section_name: Filters
            label: 'Filter for filesystems by type'
            description: 'Regex string to include discovered filesystems by type.'
        - macro: '{$VFS.FS.FSTYPE.NOT_MATCHES}'
          value: ^\s$
          description: 'Used in filesystem discovery. Can be overridden on the host or linked template level.'
          config:
            type: TEXT
            priority: '17'
            section_name: Filters
            label: 'Filter for filesystems by type (exclude)'
            description: 'Regex string to exclude discovered filesystems by type.'
        - macro: '{$VFS.FS.PUSED.MAX.CRIT}'
          value: '90'
          description: 'The critical threshold of the filesystem utilization.'
          config:
            type: TEXT
            priority: '13'
            section_name: Thresholds
            label: 'Threshold for filesystem utilization (critical)'
            description: 'Critical threshold of the filesystem utilization. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$VFS.FS.PUSED.MAX.WARN}'
          value: '80'
          description: 'The warning threshold of the filesystem utilization.'
          config:
            type: TEXT
            priority: '12'
            section_name: Thresholds
            label: 'Threshold for filesystem utilization (warning)'
            description: 'Warning threshold of the filesystem utilization. In the range from 0 to 100 inclusive.'
            regex: '^-?([0-9]+|(([0-9]+)\.([0-9]+)))$'
        - macro: '{$WINDOWS.SECURITY.ACTIVATION.GRACE.MIN.WARN}'
          value: 30d
          description: 'The minimum remaining Windows activation grace period before the trigger fires.'
          config:
            type: TEXT
            priority: '48'
            section_name: Security
            label: 'Minimum activation grace period'
            description: 'Minimum remaining Windows activation grace period before the trigger fires.'
        - macro: '{$WINDOWS.SECURITY.BITLOCKER.ENFORCE.MATCHES}'
          value: '^C:$'
          description: 'Volumes (by drive letter, e.g. "C:") on which BitLocker is enforced. The "BitLocker is not enabled" trigger fires only for matching volumes.'
          config:
            type: TEXT
            priority: '57'
            section_name: Filters
            label: 'Filter for BitLocker-enforced volumes'
            description: 'Regex string of volumes (by drive letter) on which BitLocker protection is required.'
        - macro: '{$WINDOWS.SECURITY.BITLOCKER.FSNAME.MATCHES}'
          value: '^[A-Za-z]:'
          description: 'Filter for the volumes to discover for BitLocker, by drive letter (e.g. "C:").'
          config:
            type: TEXT
            priority: '55'
            section_name: Filters
            label: 'Filter for BitLocker volumes by name'
            description: 'Regex string to include discovered BitLocker volumes by drive letter.'
        - macro: '{$WINDOWS.SECURITY.BITLOCKER.FSNAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Used in BitLocker volume discovery. Can be overridden on the host or linked template level.'
          config:
            type: TEXT
            priority: '56'
            section_name: Filters
            label: 'Filter for BitLocker volumes by name (exclude)'
            description: 'Regex string to exclude discovered BitLocker volumes by drive letter.'
        - macro: '{$WINDOWS.SECURITY.DEFENDER.FULLSCAN.MAX.WARN}'
          value: 30d
          description: 'The maximum age of the last Microsoft Defender full scan before the trigger fires.'
          config:
            type: TEXT
            priority: '50'
            section_name: Security
            label: 'Maximum Defender full scan age'
            description: 'Maximum age of the last Microsoft Defender full scan before the trigger fires.'
        - macro: '{$WINDOWS.SECURITY.DEFENDER.SIGNATURE.MAX.WARN}'
          value: 7d
          description: 'The maximum age of Microsoft Defender signatures before the trigger fires.'
          config:
            type: TEXT
            priority: '49'
            section_name: Security
            label: 'Maximum Defender signature age'
            description: 'Maximum age of Microsoft Defender signatures before the trigger fires.'
        - macro: '{$WINDOWS.SECURITY.FW.PROFILE.MATCHES}'
          value: ^(Domain|Private|Public)$
          description: 'Filter for the Windows Firewall profiles to discover, by profile name.'
          config:
            type: TEXT
            priority: '53'
            section_name: Filters
            label: 'Filter for firewall profiles by name'
            description: 'Regex string to include discovered firewall profiles by name.'
        - macro: '{$WINDOWS.SECURITY.FW.PROFILE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Used in Windows Firewall profiles discovery. Can be overridden on the host or linked template level.'
          config:
            type: TEXT
            priority: '54'
            section_name: Filters
            label: 'Filter for firewall profiles by name (exclude)'
            description: 'Regex string to exclude discovered firewall profiles by name.'
        - macro: '{$WINDOWS.SECURITY.SECUREBOOT.IGNORE}'
          value: '0'
          description: 'Set to "1" to suppress the "SecureBoot is disabled" trigger on hosts that legitimately run without UEFI Secure Boot (e.g. legacy BIOS/CSM).'
          config:
            type: CHECKBOX
            priority: '47'
            section_name: Security
            label: 'Ignore SecureBoot disabled state'
            description: 'Suppress the SecureBoot disabled trigger (for legacy BIOS/CSM hosts).'
            options:
              - checked: '1'
                unchecked: '0'
        - macro: '{$WINDOWS.TASK.CONTROL}'
          value: '1'
          description: 'Macro for the scheduled task state trigger. Can be used with the task name as context.'
          config:
            type: CHECKBOX
            priority: '46'
            label: 'Scheduled tasks control'
            description: 'Fire a trigger when a discovered scheduled task is disabled.'
            options:
              - checked: '1'
                unchecked: '0'
        - macro: '{$WINDOWS.TASK.NAME.MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Used in Windows scheduled tasks discovery. Can be overridden on the host or linked template level.'
          config:
            type: TEXT
            priority: '42'
            section_name: Filters
            label: 'Filter for scheduled tasks by name'
            description: 'Regex string to include discovered scheduled tasks by name. No task is discovered until this macro is set, because a stock Windows installation carries about 200 tasks.'
        - macro: '{$WINDOWS.TASK.NAME.NOT_MATCHES}'
          value: ^\s$
          description: 'Used in Windows scheduled tasks discovery. Can be overridden on the host or linked template level.'
          config:
            type: TEXT
            priority: '43'
            section_name: Filters
            label: 'Filter for scheduled tasks by name (exclude)'
            description: 'Regex string to exclude discovered scheduled tasks by name.'
        - macro: '{$WINDOWS.TASK.PATH.MATCHES}'
          value: '.*'
          description: 'Used in Windows scheduled tasks discovery. Can be overridden on the host or linked template level.'
          config:
            type: TEXT
            priority: '44'
            section_name: Filters
            label: 'Filter for scheduled tasks by path'
            description: 'Regex string to include discovered scheduled tasks by folder path. Note that the WMI provider returns doubled backslashes, for example: `\\Microsoft\\Windows\\`.'
        - macro: '{$WINDOWS.TASK.PATH.NOT_MATCHES}'
          value: ^\s$
          description: 'Used in Windows scheduled tasks discovery. Can be overridden on the host or linked template level.'
          config:
            type: TEXT
            priority: '45'
            section_name: Filters
            label: 'Filter for scheduled tasks by path (exclude)'
            description: 'Regex string to exclude discovered scheduled tasks by folder path. Note that the WMI provider returns doubled backslashes, for example: `\\Microsoft\\Windows\\`.'
        - macro: '{$WINDOWS.UPDATES.SECURITY.STALE.MAX.WARN}'
          value: '60'
          description: 'The maximum number of days since the last installed security update (KB) before the trigger fires.'
          config:
            type: TEXT
            priority: '52'
            section_name: Security
            label: 'Maximum days since last Security KB'
            description: 'Maximum number of days since the last installed security update (KB) before the trigger fires.'
            regex: '^[0-9]+$'
        - macro: '{$WINDOWS.UPDATES.STALE.MAX.WARN}'
          value: '45'
          description: 'The maximum number of days since the last installed update (KB) before the trigger fires.'
          config:
            type: TEXT
            priority: '51'
            section_name: Security
            label: 'Maximum days since last KB'
            description: 'Maximum number of days since the last installed update (KB) before the trigger fires.'
            regex: '^[0-9]+$'
