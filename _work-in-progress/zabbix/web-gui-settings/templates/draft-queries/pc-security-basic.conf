# ============================================================================
# Custom UserParameters for Zabbix Agent 2
# ============================================================================

# --- BASIC SECURITY ---

# User Account Control (UAC) is enabled in registry (1 = enabled, 0 = disabled)
UserParameter=win.sec.uac.enabled,reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableLUA 2>nul | find /c "0x1"

# BitLocker encryption status on system drive C: (1 = fully encrypted, 0 = decrypted/suspended)
#UserParameter=win.sec.bitlocker.c,manage-bde -status C: 2>nul | find /c "Fully Encrypted"

# Windows Firewall is enabled across profiles (returns count of active profiles, 3 = all enabled)
#UserParameter=win.sec.firewall.enabled,netsh advfirewall show allprofiles state | find /c "ON"

# RDP (Remote Desktop) is enabled (1 = enabled/listening, 0 = disabled)
#UserParameter=win.sec.rdp.enabled,reg query "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections 2>nul | find /c "0x0"

# Count local Administrator group members (helps detect unauthorized privilege escalation)
#UserParameter=win.sec.admins.count,net localgroup Administrators | find /v "Alias name" | find /v "Comment" | find /v "Members" | find /v "---" | find /v "The command completed" | find /c /v ""

# Count failed login attempts (Event ID 4625) in the Security log over the last 24 hours
#UserParameter=win.sec.failed.logins,wevtutil qe Security /q:"*[System[(EventID=4625) and TimeCreated[timediff(@SystemTime) <= 86400000]]]" /f:text 2>nul | find /c "Event["
