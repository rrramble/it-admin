# ============================================================================
# Custom UserParameters for Zabbix Agent 2
# ============================================================================

# --- NETWORK, PORTS & PROTOCOL HARDENING ---

# Legacy SMBv1 protocol is enabled (0 = disabled/safe, 1 = enabled/vulnerable to WannaCry/EternalBlue)
UserParameter=win.sec.net.smbv1,reg query "HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters" /v SMB1 2>nul | find /c "0x1"

# Telnet Client or Server is installed/running (0 = not running/safe, 1 = running)
UserParameter=win.sec.net.telnet.running,sc query TlntSvr 2>nul | find /c "RUNNING"

# SMB Signing is required on client (1 = required/safe, 0 = not required)
#UserParameter=win.sec.net.smb.signing,reg query "HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters" /v RequireSecuritySignature 2>nul | find /c "0x1"

# LLMNR (Link-Local Multicast Name Resolution) is disabled via GPO (1 = disabled/safe, 0 = enabled/spoofable)
#UserParameter=win.sec.net.llmnr.disabled,reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient" /v EnableMulticast 2>nul | find /c "0x0"

# Count currently listening TCP ports on 0.0.0.0 (detects unexpected open services)
#UserParameter=win.sec.net.listening.ports,netstat -ano -p TCP | find /c "0.0.0.0:"

# WinRM (Windows Remote Management) service is running (1 = running, 0 = stopped)
#UserParameter=win.sec.net.winrm.running,sc query WinRM 2>nul | find /c "RUNNING"
