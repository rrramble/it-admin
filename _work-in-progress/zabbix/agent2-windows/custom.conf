### Basic settings ###
# See 'Passive check' section
# Comma-delimited list of IP addresses or DNS names of Zabbix servers/proxies
Server=REPLACE_THIS_WITH_YOUR_SERVER_NAME_OR_IP

# See 'Active check' section
# Zabbix server/proxy IP:port for active checks (agent initiates connection)
ServerActive=REPLACE_THIS_WITH_YOUR_SERVER_NAME_OR_IP

# Optional: Send host metadata to Zabbix Server for Auto-Registration rules
HostMetadata=WindowsWorkstation

# Additional configuration files (custom UserParameters or plugins)
#Include=C:\Program Files\Zabbix Agent 2\configs\*.conf

############ GENERAL PARAMETERS #################

# Logging type: file, system (Windows Event Log), or console
LogType=file

# Path to the agent log file
LogFile=C:\ProgramData\ZabbixAgent2\zabbix_agent2.log

# Maximum size of log file in MB (0 - disable automatic rotation)
LogFileSize=10

# Debug level: 0 (basic), 1 (critical), 2 (error), 3 (warnings), 4 (debug), 5 (extended)
DebugLevel=3

# Path to store persistent buffer data (Agent 2 feature for offline resilience)
EnablePersistentBuffer=1
PersistentBufferFile=C:\ProgramData\ZabbixAgent2\zabbix_agent2.db
PersistentBufferPeriod=2h

# Allows using '%' symbol in user configuration files
#UnsafeUserParameters=1

############ PASSIVE CHECKS #####################

# Port the agent listens on for incoming connections from the server
ListenPort=10050

# Listen on all network interfaces (default)
# ListenIP=0.0.0.0

# Number of pre-forked instances / connection handlers (default is usually fine)
# StatusPort=10052

############ ACTIVE CHECKS ######################

# Unique, case-sensitive hostname. Leave commented out when using HostnameItem below
# Hostname=Windows-Workstation-01

# Dynamically fetch the Windows computer name (ideal for mass deployment)
HostnameItem=system.hostname

# How often list of active checks is refreshed, in seconds
RefreshActiveChecks=120

# Buffer size in memory for active checks
BufferSend=5
BufferSize=100

############ ADVANCED & TIMEOUTS ################

# Spend no more than Timeout seconds on processing (1-30)
Timeout=10

# Plugin socket path (used internally by Zabbix Agent 2)
ControlSocket=\\.\pipe\agent.sock

############ SECURITY & ENCRYPTION ##############

# Deny execution of remote commands from Zabbix Server by default (recommended)
DenyKey=system.run[*]

# --- TLS / PSK Encryption (Uncomment and configure if using encryption) ---
# TLSConnect=psk
# TLSAccept=psk
# TLSPSKIdentity=PSK_WINDOWS_01
# TLSPSKFile=C:\Program Files\Zabbix Agent 2\zabbix_agent2.psk
