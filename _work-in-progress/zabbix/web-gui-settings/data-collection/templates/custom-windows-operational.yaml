  triggers:
    - uuid: cba4daba60f8428f8bdeb2a7953c16aa
      expression: 'min(/Custom Windows operational/perf_counter_en["\System\Processor Queue Length"],5m) - last(/Custom Windows operational/wmi.get[root/cimv2,"Select NumberOfLogicalProcessors from Win32_ComputerSystem"]) * 2 > {$CPU.QUEUE.CRIT.MAX}'
      name: 'Windows: CPU queue length is too high'
      event_name: 'Windows: CPU queue length is too high (over {$CPU.QUEUE.CRIT.MAX} for 5m)'
      priority: WARNING
      description: 'The CPU Queue Length in the last 5 minutes exceeds `{$CPU.QUEUE.CRIT.MAX}`. According to actual observations, PQL should not exceed the number of cores * 2. To fine-tune the conditions, use the macro `{$CPU.QUEUE.CRIT.MAX }`.'
      dependencies:
        - name: 'Windows: High CPU utilization'
          expression: 'min(/Custom Windows operational/system.cpu.util,5m)>{$CPU.UTIL.CRIT}'
      tags:
        - tag: scope
          value: performance
    - uuid: b15468ddfe214ae6bacdf441f1e04e01
      expression: 'max(/Custom Windows operational/system.swap.pfree,5m)<{$SWAP.PFREE.MIN.WARN} and last(/Custom Windows operational/system.swap.size[,total])>0'
      name: 'Windows: High swap space usage'
      event_name: 'Windows: High swap space usage (less than {$SWAP.PFREE.MIN.WARN}% free)'
      opdata: 'Free: {ITEM.LASTVALUE1}, total: {ITEM.LASTVALUE2}'
      priority: WARNING
      description: 'This trigger is ignored, if there is no swap configured'
      dependencies:
        - name: 'Windows: High memory utilization'
          expression: 'min(/Custom Windows operational/vm.memory.size[pused],5m)>{$MEMORY.UTIL.MAX}'
      tags:
        - tag: scope
          value: performance
