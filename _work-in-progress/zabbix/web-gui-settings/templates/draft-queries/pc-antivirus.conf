# ============================================================================
# Custom UserParameters for Zabbix Agent 2
# ============================================================================

# --- ANTIVIRUS & EDR CHECKS ---

# Windows Defender Antivirus service is running (1 = running, 0 = stopped)
#UserParameter=win.sec.defender.running,sc query WinDefend | find /c "RUNNING"

# Windows Defender Real-Time Protection is NOT disabled by policy (0 = active/safe, 1 = disabled)
#UserParameter=win.sec.av.defender.disabled,reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" /v DisableRealtimeMonitoring 2>nul | find /c "0x1"

# ESET Endpoint Antivirus service is running (1 = running, 0 = stopped)
#UserParameter=win.sec.av.eset,sc query ekrn 2>nul | find /c "RUNNING"

# Kaspersky Endpoint Security service is running (1 = running, 0 = stopped)
#UserParameter=win.sec.av.kaspersky,sc query AVP 2>nul | find /c "RUNNING"

# Dr.Web Antivirus service (DrWebEngine) is running (1 = running, 0 = stopped)
#UserParameter=win.sec.av.drweb.service,sc query DrWebEngine 2>nul | find /c "RUNNING"

# Dr.Web SpIDer Guard real-time protection process is active (1 = running, 0 = stopped)
#UserParameter=win.sec.av.drweb.guard,tasklist /FI "IMAGENAME eq dwservice.exe" 2>nul | find /I /C "dwservice.exe"
